<!doctype html>
<html><head><meta charset="utf-8"><title>Dayli</title>
<script>
  (function () {
    var p = location.pathname;
    var join = p.match(/^\/join\/([A-Za-z0-9-]+)\/?$/);
    if (join) { location.replace('/join/?code=' + encodeURIComponent(join[1])); return; }
    var game = p.match(/^\/g\/([A-Za-z0-9-]+)\/?$/);
    if (game) { location.replace('/g/?c=' + encodeURIComponent(game[1])); return; }
    var team = p.match(/^\/t\/([a-z0-9-]+)\/?$/);
    if (team) { location.replace('/t/?s=' + encodeURIComponent(team[1])); return; }
    var inv = p.match(/^\/invite\/([A-Za-z0-9-]+)\/?$/);
    if (inv) { location.replace('/invite/?code=' + encodeURIComponent(inv[1])); return; }
    var ev = p.match(/^\/e\/([a-z0-9-]+)\/?$/);
    if (ev) { location.replace('/e/?s=' + encodeURIComponent(ev[1]) + (location.search ? '&' + location.search.slice(1) : '')); return; }
    var base = p.indexOf('/app/') === 0 || p === '/app' ? '/app' : p.indexOf('/demo/') === 0 || p === '/demo' ? '/demo' : null;
    if (base) location.replace(base + '/?_path=' + encodeURIComponent(p + location.search + location.hash));
    else location.replace('/');
  })();
</script>
</head><body></body></html>
