<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dayli</title>
    <meta name="robots" content="noindex" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, 'Inter', 'Helvetica Neue', Arial, sans-serif;
        background: #f6f5f1;
        color: #1c1a17;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: #fff;
        border-radius: 22px;
        padding: 32px 26px;
        max-width: 380px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(28, 26, 23, 0.08);
      }
      .icon {
        font-size: 44px;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 26px;
        margin: 12px 0 8px;
      }
      p {
        color: #847f74;
        line-height: 1.5;
        margin: 0 0 22px;
      }
      a.btn {
        display: block;
        background: #2f6b4f;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        padding: 14px;
        border-radius: 14px;
      }
    </style>
  </head>
  <body>
    <!-- Where Stripe sends people back to from team payments (team-pay):
         ?paid=1 after paying, ?cancelled=1, ?stripe=1 after setting up payments, ?retry=1. -->
    <div class="card">
      <div class="icon" id="icon">✅</div>
      <h1 id="title">Payment received</h1>
      <p id="text">Thanks. It shows as paid in Dayli in a moment.</p>
      <a class="btn" id="back" href="dayli://">Back to Dayli</a>
    </div>
    <script>
      var q = new URLSearchParams(location.search);
      // Back to the team the payment is for, not the app's home screen.
      var team = q.get('team') || '';
      if (/^[0-9a-f-]{36}$/i.test(team)) document.getElementById('back').href = 'dayli://team/' + team;
      var set = function (icon, title, text) {
        document.getElementById('icon').textContent = icon;
        document.getElementById('title').textContent = title;
        document.getElementById('text').textContent = text;
      };
      if (q.get('cancelled')) set('↩️', 'No payment taken', 'You left before paying, so nothing was charged. Pay from Dayli whenever you are ready.');
      if (q.get('stripe')) set('🏦', 'Details sent to Stripe', 'Go back to Dayli and tap Check again. Stripe usually takes a few minutes, sometimes up to 5 working days.');
      if (q.get('retry')) set('↩️', 'That link has run out', 'Go back to Dayli and tap Set up payments again to carry on where you left off.');
    </script>
  </body>
</html>
