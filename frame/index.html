<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Dayli Frame</title>
  <link rel="icon" href="../img/icon.svg" type="image/svg+xml" />
  <!--
    Dayli Frame: a shared calendar's photos and plans on any tablet or spare
    phone. It shows a code; someone in the calendar enters it in Dayli
    (calendar → Photos & frame → Set up a photo frame). The frame keeps its
    key in this browser and asks the "frame" Edge Function for photos and
    plans every minute: photos as a slideshow with the clock, and the week
    ahead across the bottom (today in paper, each event in the colour of the
    people it's with). Unpairing in the app brings the code back.
  -->
  <style>
    :root { --green: #2F6B4F; --paper: #F6F5F1; --ink: #1C1A17; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #fff; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    [hidden] { display: none !important; }

    /* Pairing */
    #pair { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3vmin; padding: 6vmin; text-align: center; background: radial-gradient(120% 90% at 50% 0%, #3A7D5D, var(--green) 50%, #1F4a37); }
    #pair img { width: 12vmin; height: 12vmin; }
    #pair h1 { font-size: 6vmin; font-weight: 400; letter-spacing: -0.02em; }
    #code { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; font-size: 14vmin; letter-spacing: 0.08em;
      background: rgba(255,255,255,.12); padding: 1.5vmin 5vmin; border-radius: 3vmin; }
    #pair p { font-size: 3vmin; line-height: 1.45; max-width: 70ch; opacity: .9; }
    #pair .small { font-size: 2.4vmin; opacity: .7; }

    /* Showing */
    #show { position: fixed; inset: 0; }
    .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease; }
    .slide.on { opacity: 1; }
    .slide .bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) brightness(.55); }
    .slide .ph { position: absolute; inset: 0; background-size: contain; background-repeat: no-repeat; background-position: center; }
    .shade { position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 45%), linear-gradient(to bottom, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 22%); }
    /* The week across the bottom: today in paper, the rest on dark glass. */
    #week { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 1px; background: rgba(0,0,0,.38); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,.12); min-height: var(--week-h); }
    #week .d { min-width: 0; overflow: hidden; padding: 1.4vmin 1.3vmin 1.6vmin; }
    #week .d.today { background: rgba(246,245,241,.96); color: var(--ink); }
    #week .dn { font-size: 1.7vmin; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
    #week .today .dn { color: var(--green); opacity: 1; }
    #week .num { font-size: 4.2vmin; font-weight: 300; line-height: 1.1; margin-bottom: .6vmin; }
    #week .today .num { font-weight: 600; }
    #week .ev { display: flex; align-items: baseline; gap: .7vmin; font-size: 1.9vmin; line-height: 1.3; margin-top: .6vmin; min-width: 0; }
    #week .ev i { flex: none; width: 1.1vmin; height: 1.1vmin; border-radius: 50%; align-self: center; }
    #week .ev b { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; opacity: .9; }
    #week .ev span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #week .more, #week .free { font-size: 1.7vmin; opacity: .55; margin-top: .6vmin; }
    #week .free { font-style: italic; }
    #clock { position: absolute; left: 4vmin; bottom: calc(var(--week-h) + 3vmin); text-shadow: 0 2px 12px rgba(0,0,0,.5); }
    #time { font-size: 13vmin; font-weight: 300; letter-spacing: -0.03em; line-height: 1; }
    #date { font-size: 3.6vmin; margin-top: 1vmin; opacity: .92; }
    #caption { position: absolute; right: 4vmin; top: 4vmin; max-width: 50%; text-align: right; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
    #caption .c { font-size: 3.4vmin; line-height: 1.3; }
    #caption .d { font-size: 2.6vmin; font-weight: 600; opacity: .92; margin-top: .6vmin; }
    #caption .f { font-size: 2.4vmin; opacity: .8; margin-top: .4vmin; }
    :root { --week-h: 22vmin; }
    /* Narrow screens show the next few days only; the rest come round as the week moves on. */
    @media (orientation: portrait) {
      :root { --week-h: 26vmin; }
      #week { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      #week .d:nth-child(n+5) { display: none; }
      #week .dn { font-size: 2.2vmin; } #week .num { font-size: 5vmin; } #week .ev { font-size: 2.4vmin; } #week .more, #week .free { font-size: 2.1vmin; }
      #caption { max-width: 60%; }
    }
    @media (orientation: portrait) and (min-width: 600px) {
      #week { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      #week .d:nth-child(5) { display: block; }
    }
    /* Plans switched off for this frame: the clock drops to the corner. */
    #show.noweek #clock { bottom: 4vmin; }
    #name { position: absolute; top: 4vmin; left: 4vmin; font-size: 3vmin; opacity: .85; text-shadow: 0 2px 12px rgba(0,0,0,.5);
      display: flex; align-items: center; gap: 1.4vmin; }
    #name img { width: 4.4vmin; height: 4.4vmin; }
    #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10vmin;
      background: radial-gradient(120% 90% at 30% 20%, #3A7D5D, var(--green) 50%, #1F4a37); }
    #empty p { font-size: 4vmin; line-height: 1.4; max-width: 30ch; }
    #night { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity 4s; pointer-events: none; }
    #night.on { opacity: .82; }
    #hint { position: fixed; left: 50%; top: 2vmin; transform: translateX(-50%); background: rgba(0,0,0,.6); padding: 1vmin 2.4vmin;
      border-radius: 99px; font-size: 2.2vmin; opacity: 0; transition: opacity .6s; pointer-events: none; }
    #hint.on { opacity: 1; }
  </style>
</head>
<body>
  <section id="pair" hidden>
    <img src="../img/icon.svg" alt="" />
    <h1 class="serif">Dayli Frame</h1>
    <div id="code">······</div>
    <p>In Dayli, open your shared calendar → <b>Photos &amp; frame</b> → <b>Set up a photo frame</b>, and enter this code.</p>
    <p class="small" id="pairNote">The code changes every 15 minutes.</p>
  </section>

  <section id="show" hidden>
    <div id="slides"></div>
    <div id="empty" hidden><p class="serif" id="emptyText">Send photos from Dayli and they'll appear here.</p></div>
    <div class="shade"></div>
    <div id="name"><img src="../img/icon.svg" alt="" /><span id="calName"></span></div>
    <div id="caption"><div class="c" id="capText"></div><div class="d" id="capDay"></div><div class="f" id="capFrom"></div></div>
    <div id="clock"><div id="time"></div><div id="date"></div></div>
    <div id="week" hidden></div>
    <div id="night"></div>
  </section>
  <div id="hint">Tap for full screen</div>

<script src="../config.js"></script>
<script>
(function () {
  var cfg = window.DAYLI_CONFIG || {};
  var FN = cfg.supabaseUrl + '/functions/v1/frame';
  var KEY = 'dayli.frame.token';
  var SLIDE_MS = 12000;
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    set: function (v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} },
  };

  function call(body) {
    return fetch(FN, {
      method: 'POST',
      headers: { 'content-type': 'application/json', apikey: cfg.supabaseAnonKey, authorization: 'Bearer ' + cfg.supabaseAnonKey },
      body: JSON.stringify(body),
    }).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
  }
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  // ---------- pairing ----------
  var pairing = false;
  async function pair() {
    if (pairing) return;
    pairing = true;
    $('show').hidden = true; $('pair').hidden = false;
    while (true) {
      var started;
      try { started = await call({ action: 'start' }); } catch (e) { started = null; }
      if (!started || started.status !== 200) { $('code').textContent = '······'; $('pairNote').textContent = 'Can’t reach Dayli. Trying again…'; await wait(10000); continue; }
      var code = started.body.code, secret = started.body.secret;
      $('code').textContent = code.slice(0, 3) + '-' + code.slice(3);
      $('pairNote').textContent = 'The code changes every 15 minutes.';
      while (true) {
        await wait(3000);
        var r;
        try { r = await call({ action: 'claim', secret: secret }); } catch (e) { continue; }
        if (r.body.status === 'paired') { store.set(r.body.token); pairing = false; return show(); }
        if (r.body.status === 'expired') break;
      }
    }
  }

  // ---------- showing ----------
  var photos = [], idx = -1, slideTimer = null, feedTimer = null, tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  var lastEvents = null, lastShow = false, lastDayKey = null;
  var two = function (n) { return (n < 10 ? '0' : '') + n; };
  function hm(d) { return two(d.getHours()) + ':' + two(d.getMinutes()); }
  function dayKey(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
  function dayLabel(d) {
    var now = new Date(), tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    if (dayKey(d) === dayKey(now)) return 'Today';
    if (dayKey(d) === dayKey(tomorrow)) return 'Tomorrow';
    return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function tick() {
    var now = new Date();
    $('time').textContent = hm(now);
    $('date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    var h = now.getHours();
    $('night').classList.toggle('on', h >= 22 || h < 7);
    // Past midnight the week moves on a day, and events that have finished drop off.
    if (lastEvents && dayKey(now) !== lastDayKey) { lastDayKey = dayKey(now); renderWeek(lastEvents, lastShow); }
  }

  // Seven days across the bottom, starting today; each event with its time
  // and the colour of the people it's with (the calendar's own colours).
  var MAX_PER_DAY = 3;
  function renderWeek(events, showEvents) {
    var box = $('week');
    box.hidden = !showEvents;
    $('show').classList.toggle('noweek', !showEvents);
    if (!showEvents) return;
    box.textContent = '';
    var now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var byDay = {};
    (events || []).forEach(function (e) {
      if (Date.parse(e.ends_at) <= now.getTime()) return;
      var s = new Date(e.starts_at);
      // All-day events start at midnight in their own time zone; file them by that date.
      var d = e.all_day ? new Date(s.toLocaleString('en-US', { timeZone: e.timezone || tz })) : s;
      var start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      // Something already under way (or spanning days) belongs to today.
      if (start < today) start = today;
      var k = dayKey(start);
      (byDay[k] = byDay[k] || []).push(e);
    });
    for (var i = 0; i < 7; i++) {
      var day = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
      var col = document.createElement('div'); col.className = 'd' + (i === 0 ? ' today' : '');
      var dn = document.createElement('div'); dn.className = 'dn';
      dn.textContent = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : day.toLocaleDateString(undefined, { weekday: 'short' });
      var num = document.createElement('div'); num.className = 'num'; num.textContent = String(day.getDate());
      col.appendChild(dn); col.appendChild(num);
      var list = byDay[dayKey(day)] || [];
      list.slice(0, MAX_PER_DAY).forEach(function (e) {
        var row = document.createElement('div'); row.className = 'ev';
        var dot = document.createElement('i'); dot.style.background = e.color || '#9fd4b4';
        row.appendChild(dot);
        // No time means all day: the title gets the room.
        if (!e.all_day) { var t = document.createElement('b'); t.textContent = hm(new Date(e.starts_at)); row.appendChild(t); }
        var n = document.createElement('span'); n.textContent = e.title; n.title = e.title;
        row.appendChild(n); col.appendChild(row);
      });
      if (list.length > MAX_PER_DAY) {
        var more = document.createElement('div'); more.className = 'more'; more.textContent = '+' + (list.length - MAX_PER_DAY) + ' more'; col.appendChild(more);
      } else if (!list.length) {
        var free = document.createElement('div'); free.className = 'free'; free.textContent = 'Nothing on'; col.appendChild(free);
      }
      box.appendChild(col);
    }
  }

  function nextSlide() {
    if (!photos.length) return;
    idx = (idx + 1) % photos.length;
    var p = photos[idx];
    var slides = $('slides');
    var el = document.createElement('div'); el.className = 'slide';
    var bg = document.createElement('div'); bg.className = 'bg'; bg.style.backgroundImage = 'url("' + p.url + '")';
    var ph = document.createElement('div'); ph.className = 'ph'; ph.style.backgroundImage = 'url("' + p.url + '")';
    el.appendChild(bg); el.appendChild(ph);
    var img = new Image();
    img.onload = function () {
      slides.appendChild(el);
      requestAnimationFrame(function () { el.classList.add('on'); });
      setTimeout(function () { while (slides.children.length > 1) slides.removeChild(slides.firstChild); }, 1800);
      $('capText').textContent = p.caption || '';
      $('capDay').textContent = p.day ? dayLabel(new Date(p.day + 'T12:00:00')) : '';
      $('capFrom').textContent = p.from ? 'from ' + p.from : '';
    };
    img.onerror = function () { setTimeout(nextSlide, 500); };
    img.src = p.url;
  }

  async function feed() {
    var token = store.get();
    if (!token) return pair();
    var r;
    try { r = await call({ action: 'feed', token: token }); } catch (e) { return; }
    if (r.status === 401) { store.set(null); clearInterval(slideTimer); clearInterval(feedTimer); return pair(); }
    if (r.status !== 200) return;
    var data = r.body;
    $('calName').textContent = data.calendar.name;
    var fresh = data.photos || [];
    // Keep the slideshow going; newly sent photos are shown next.
    var known = {}; photos.forEach(function (p) { known[p.id] = true; });
    var added = fresh.filter(function (p) { return !known[p.id]; });
    var ids = {}; fresh.forEach(function (p) { ids[p.id] = p; });
    photos = photos.filter(function (p) { return ids[p.id]; }).map(function (p) { return ids[p.id]; });
    if (added.length && photos.length) photos.splice(idx + 1, 0, ...added); else photos = photos.concat(added);
    if (idx >= photos.length) idx = -1;
    $('empty').hidden = photos.length > 0;
    $('emptyText').textContent = 'Send photos to ' + data.calendar.name + ' from Dayli and they’ll appear here.';
    lastEvents = data.events; lastShow = data.frame.show_events; lastDayKey = dayKey(new Date());
    renderWeek(data.events, data.frame.show_events);
    if (!slideTimer) {
      if (photos.length) { nextSlide(); slideTimer = setInterval(nextSlide, SLIDE_MS); }
    } else if (added.length) {
      // Show what just arrived straight away.
      clearInterval(slideTimer); nextSlide(); slideTimer = setInterval(nextSlide, SLIDE_MS);
    }
  }

  function show() {
    $('pair').hidden = true; $('show').hidden = false;
    photos = []; idx = -1; clearInterval(slideTimer); slideTimer = null; $('slides').textContent = '';
    tick();
    feed();
    clearInterval(feedTimer);
    feedTimer = setInterval(feed, 60000);
  }

  // Keep the screen awake and offer full screen.
  var wakeLock = null;
  function awake() { if ('wakeLock' in navigator && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {}); }
  document.addEventListener('visibilitychange', awake);
  document.addEventListener('click', function () {
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {});
    awake();
  });
  if (document.fullscreenEnabled) { $('hint').classList.add('on'); setTimeout(function () { $('hint').classList.remove('on'); }, 6000); }

  setInterval(tick, 1000 * 15);
  awake();
  if (store.get()) show(); else pair();
})();
</script>
</body>
</html>
