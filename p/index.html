<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dayli</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --bg: #f6f5f1;
        --surface: #fff;
        --text: #1c1a17;
        --muted: #847f74;
        --border: #e6e3da;
        --accent: #2f6b4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171613;
          --surface: #201f1a;
          --text: #f3f1ea;
          --muted: #a39e92;
          --border: #353229;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 560px; margin: 0 auto; padding: 16px; }
      .hero {
        height: 220px;
        border-radius: 16px;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 72px;
        font-weight: 800;
        background-size: cover;
        background-position: center;
      }
      .when { color: #e5484d; font-weight: 700; letter-spacing: 0.02em; margin: 20px 0 4px; text-transform: uppercase; font-size: 13px; }
      h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.2; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-top: 16px; }
      .row { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0; }
      .muted { color: var(--muted); }
      .cta { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; padding: 14px; border-radius: 999px; margin-top: 20px; }
      .foot { color: var(--muted); font-size: 13px; text-align: center; margin: 24px 0; }
      [hidden] { display: none !important; }
    </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-v2-32.png" /><link rel="icon" type="image/png" sizes="192x192" href="/favicon-v2-192.png" /><link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" /></head>
  <body>
    <main>
      <div id="loading" class="muted">Loading…</div>
      <div id="missing" hidden>
        <h1>Nothing here</h1>
        <p class="muted">This page is private, or the link is wrong. Ask whoever sent it for a fresh one.</p>
      </div>
      <article id="page" hidden>
        <div class="hero" id="hero"></div>
        <div class="when" id="when"></div>
        <h1 id="title"></h1>
        <div class="card">
          <div class="row" id="where-row" hidden><span>📍</span><span id="where"></span></div>
          <div class="row"><span>👥</span><span id="going"></span></div>
        </div>
        <div class="card" id="desc-card" hidden><p id="desc" style="margin: 0; white-space: pre-wrap"></p></div>
        <a class="cta" id="cta" href="#">Open in Dayli</a>
      </article>
      <p class="foot">Made with Dayli · shared calendars for families and friends</p>
    </main>
    <script src="../config.js?v=6da0949"></script>
    <script src="page.js?v=6da0949"></script>
  </body>
</html>
